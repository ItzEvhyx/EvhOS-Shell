shell=fish
title=foot
font=JetBrains Mono Nerd Font:size=12
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[colors-dark]
alpha-mode = all
alpha=0.78
blur=yes

[key-bindings]
clipboard-paste=Control+Shift+v XF86Paste
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[text-bindings]
\x16=Control+Mod1+v

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
